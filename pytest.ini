[pytest]
testpaths = tests
filterwarnings =
    error
    # Tkinter raeumt seine Variablen erst ab, wenn das zugehoerige Fenster
    # schon zerstoert ist.  Die Ausnahme wird von Python verschluckt und hat
    # keine Wirkung auf das Programm -- ein Eingriff dagegen hat den Testlauf
    # zum Absturz gebracht.  Deshalb bewusst nur diese eine Ausnahme.
    ignore::pytest.PytestUnraisableExceptionWarning
